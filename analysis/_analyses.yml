# Analysis pages. Each page uses one or more attribute blocks (registry/*.yml) and shows numbers
# only from the chain outputs listed under `assets` (copied by _build_analysis_assets.R).
# A new analysis = a new entry here + analysis/<id>.qmd + a link in analysis/index.qmd (listing).
analyses:
  - id: milei-question
    title: "The Milei question: how liberal are right-wing populist parties?"
    authors: "Martin Rode and Sebastian Stöckl"
    authors_md: "[Martin Rode](https://sites.google.com/unav.es/martin-rode/home) and [Sebastian Stöckl](http://www.sebastianstoeckl.com)"
    status: "working paper, results v2026a"
    blocks: [poplib_v4]
    assets:
      csv:
        - 41_corpus_counts.csv
        - 41_tab4_8_regressions_long.csv
        - 41_fig4_5_trend_slopes.csv
        - 41_fig6_10_interaction_tests.csv
        - 42_headline_distribution.csv
        - 42_per_fork.csv
        - 43_nse_rules.csv
        - 44_external_validity.csv
        - 44_interaction_robustness.csv
      fig:
        - Populism_Over_Time
        - Liberalism_Over_Time_by_Ideology
        - spec_curve
        - spec_curve_hist
        - Marginal_Effect_Populism_on_Liberalism_by_Ideology
        - Marginal_Effect_Populism_on_Political_Liberalism_by_Ideology
        - Marginal_Effect_Populism_on_Social_Liberalism_by_Ideology
        - Marginal_Effect_Populism_on_Economic_Liberalism_by_Ideology
        - Marginal_Effect_Populism_on_Financial_Market_Liberalism_by_Ideology
