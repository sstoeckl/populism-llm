# Models that can appear in any block. `combined` is the cross-model value shown by default.
models:
  - {id: combined,  short: "Combined",     label: "Cross-model mean",  family: "",          colour: "#333333"}
  - {id: sonnet,    short: "Sonnet",       label: "claude-sonnet-4-6", family: "Anthropic", colour: "#1b9e77"}
  - {id: gpt41mini, short: "GPT-4.1-mini", label: "gpt-4.1-mini-2025-04-14", family: "OpenAI", colour: "#d95f02"}
  - {id: gemini,    short: "Gemini",       label: "gemini-3.5-flash",  family: "Google",    colour: "#7570b3"}
# Evidence text policy for the pages.
#   quote8  : quotes cut to their first 8 words, no context (public input files only).
#   context : a window of at most `context_words` words of the model's context passage around the
#             quote (quote highlighted). Reads the restricted raw files of the workbench. Decided by
#             Sebastian on 2026-10-27 while the written permission of the Manifesto Project is being
#             requested (Martin Rode, 2026-10-27). The download file always keeps quote8.
evidence_text: context
context_words: 40
pdf_base: "https://manifesto-project.wzb.eu"
corpus: "MPDS2026a / corpus 2026-1"
parfam:
  "10": "Ecological"
  "20": "Socialist/communist"
  "30": "Social democratic"
  "40": "Liberal"
  "50": "Christian democratic"
  "60": "Conservative"
  "70": "Nationalist"
  "80": "Agrarian"
  "90": "Ethnic/regional"
  "95": "Special issue"
  "98": "Electoral alliance"
  "999": "Missing"
