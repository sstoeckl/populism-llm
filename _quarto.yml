project:
  type: website
  output-dir: _site
  resources:
    - "CNAME"
    - "data/download/*"
    - "data/prompt/*"
    - "data/specs_distinct_pop.csv"
    - "data/registry.json"
    - "data/version.json"
    - "data/status.json"

website:
  title: "Populism-LLM"
  description: "Populism, populist ideology and liberalism scores with evidence for 3,371 party manifestos, scored by three language model families"
  site-url: "https://populism-llm.org/"
  repo-url: "https://github.com/sstoeckl/populism-llm"
  repo-actions: [issue]
  page-navigation: true
  search:
    location: navbar
    type: overlay
    limit: 20
  navbar:
    background: dark
    logo: assets/logo.svg
    left:
      - href: index.qmd
        text: Home
      - href: browse.qmd
        text: Browse
      - text: Analyses
        menu:
          - href: analysis/milei-question.qmd
            text: "The Milei question (Rode & Stöckl 2026)"
          - href: interactive/regression.qmd
            text: Specification curve
          - href: analysis/index.qmd
            text: All analyses
      - href: cross-model.qmd
        text: Model Agreement
      - href: methodology.qmd
        text: Methodology
      - href: download.qmd
        text: Data & Reproduction
    right:
      - text: Replication package
        icon: github
        href: https://github.com/sstoeckl/populism-llm-replication
        aria-label: Replication package on GitHub
  page-footer:
    left: |
      **Research:** [Martin Rode](https://sites.google.com/unav.es/martin-rode/home) (Universidad de Navarra) · [Sebastian Stöckl](http://www.sebastianstoeckl.com) (University of Liechtenstein). Data version v2026a.
    center: |
      **Site maintainer:** [Sebastian Stöckl](http://www.sebastianstoeckl.com) · [replication package](https://github.com/sstoeckl/populism-llm-replication) · [data on Hugging Face](https://huggingface.co/datasets/sstoeckl/populism-llm-replication) · [site code](https://github.com/sstoeckl/populism-llm) ([MIT](https://opensource.org/licenses/MIT)) · data [CC-BY 4.0](https://creativecommons.org/licenses/by/4.0/)
    right: |
      Manifesto texts © their authors, via the [Manifesto Project](https://manifesto-project.wzb.eu/).
  open-graph: true
  twitter-card: false
  body-header: |
    <div class="draft-banner" role="note">
      Companion to the working paper <a href="https://ssrn.com/abstract=7758858"><em>The Milei question</em></a> (Rode &amp; Stöckl 2026)<span class="paper-status"></span> · <a href="https://ssrn.com/abstract=7758858">paper (SSRN)</a> · <a href="/analysis/milei-question.html">results</a> ·
      <a href="https://github.com/sstoeckl/populism-llm-replication">replication package</a> ·
      <a href="/download.html#cite">how to cite</a>
    </div>
    <script>
      fetch("/data/status.json", {cache: "no-store"}).then(r => r.ok ? r.json() : {}).then(j => {
        if (j && j.status) document.querySelectorAll(".paper-status").forEach(e => { e.textContent = " · " + j.status; });
      }).catch(() => {});
    </script>

format:
  html:
    theme:
      light: [cosmo, assets/css/custom.scss]
      dark:  [darkly, assets/css/custom-dark.scss]
    css: assets/css/site.css
    toc: true
    toc-depth: 3
    code-fold: false
    code-copy: true
    smooth-scroll: true
    fig-width: 8
    fig-height: 5
    fig-dpi: 150
    page-layout: article

execute:
  freeze: auto
  warning: false
  message: false

